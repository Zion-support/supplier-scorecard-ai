<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Supplier Scorecard AI</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:90px}label{display:inline-block;margin:.3rem .6rem .3rem 0}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📦 Supplier Scorecard AI</h1><p>Score a supplier (percentages).</p><label>On-time %: <input id="o" type="number" value="92"></label><label>Quality %: <input id="q" type="number" value="97"></label><label>Cost competitiveness %: <input id="c" type="number" value="85"></label><label>Responsiveness %: <input id="r" type="number" value="90"></label><button onclick="go()">Score</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const s=(g('o')*0.35+g('q')*0.3+g('c')*0.2+g('r')*0.15).toFixed(1);document.getElementById('out').textContent=`Weighted score: ${s}/100 — ${s>=90?'🟢 Preferred supplier':s>=75?'🟡 Approved, monitor quarterly':'🔴 Review / dual-source'}\n\nAutomated scorecards with ERP integration: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/supplier-scorecard-ai">GitHub</a> · <a href="https://ziontechgroup.com/supplier-risk-radar/">Supplier Risk Radar</a></p></body></html>
