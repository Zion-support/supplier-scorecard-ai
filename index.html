<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Supplier Scorecard AI</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}input{padding:.4rem;width:80px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📦 Supplier Scorecard AI</h1><p>Score a supplier (enter % for each KPI).</p><label>On-time delivery % <input id="o" type="number" value="92"></label><label>Quality (defect-free) % <input id="q" type="number" value="97"></label><label>Cost competitiveness % <input id="c" type="number" value="85"></label><label>Responsiveness % <input id="r" type="number" value="88"></label><button onclick="go()">Score</button><div id="out"></div><script>function go(){const v=['o','q','c','r'].map(id=>+document.getElementById(id).value);const w=[0.35,0.3,0.2,0.15];const sc=(v[0]*w[0]+v[1]*w[1]+v[2]*w[2]+v[3]*w[3]).toFixed(1);document.getElementById('out').textContent=`Composite score: ${sc}/100 — ${sc>=90?'🟢 Preferred supplier':sc>=75?'🟡 Approved — monitor quarterly':'🔴 At-risk — corrective plan required'}\nWeakest KPI: ${['Delivery','Quality','Cost','Responsiveness'][v.indexOf(Math.min(...v))]}\n\nAutomated scorecards + escalation: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/supplier-scorecard-ai">GitHub</a> · <a href="https://ziontechgroup.com/supplier-risk-radar/">Supplier Risk Radar</a></p></body></html>
